pipeline:
  name: CI
  identifier: CI
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  variables:
    - name: containerise
      type: String
      description: Build the application container after tests pass
      required: true
      value: <+input>
    - name: push_to_acr
      type: String
      description: Push the successfully built container to Azure Container Registry
      required: true
      value: <+input>
    - name: acr_login_server
      type: String
      description: Azure Container Registry login server
      required: true
      value: <+input>
    - name: azure_resource_group
      type: String
      description: Resource group containing the Azure Container App
      required: true
      value: <+input>
    - name: azure_container_app_name
      type: String
      description: Azure Container App updated after the image is published
      required: true
      value: <+input>
    - name: azure_tenant_id
      type: String
      description: Microsoft Entra tenant used for deployment
      required: true
      value: <+input>
    - name: azure_subscription_id
      type: String
      description: Azure subscription containing the Container App
      required: true
      value: <+input>
  stages:
    - stage:
        name: Test
        identifier: Test
        description: Validate and build the pull request on the local delegate
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Prepare test workspace
                  identifier: Prepare_test_workspace
                  spec:
                    shell: Bash
                    executionTarget: {}
                    delegateSelectors:
                      - local-delegate
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -eu

                          NODE_VERSION="22.14.0"
                          REPOSITORY_URL="https://github.com/dosullivan557/Devops-coursework.git"
                          SOURCE_BRANCH='<+trigger.branch>'
                          BUILD_ROOT="/tmp/change-audit-<+pipeline.executionId>"
                          NODE_HOME="$BUILD_ROOT/node"
                          SOURCE_DIR="$BUILD_ROOT/source"
                          ASKPASS="$BUILD_ROOT/git-askpass.sh"

                          case "$(uname -m)" in
                            x86_64) NODE_ARCH="x64" ;;
                            arm64|aarch64) NODE_ARCH="arm64" ;;
                            *) echo "Unsupported delegate architecture: $(uname -m)" >&2; exit 1 ;;
                          esac

                          command -v curl >/dev/null 2>&1 || { echo "curl is required on the delegate" >&2; exit 1; }
                          command -v git >/dev/null 2>&1 || { echo "git is required on the delegate" >&2; exit 1; }

                          mkdir -p "$NODE_HOME"
                          curl --fail --location --silent --show-error \
                            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.gz" \
                            | tar -xz --strip-components=1 -C "$NODE_HOME"
                          export PATH="$NODE_HOME/bin:$PATH"

                          node --version
                          npm --version

                          printf '%s\n' '#!/bin/sh' \
                            'case "$1" in' \
                            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
                            '  *Password*) printf "%s\\n" "$GITHUB_TOKEN" ;;' \
                            'esac' > "$ASKPASS"
                          chmod 700 "$ASKPASS"

                          GIT_ASKPASS="$ASKPASS" GIT_ASKPASS_REQUIRE=force GIT_TERMINAL_PROMPT=0 \
                          git clone --depth 1 --branch "$SOURCE_BRANCH" "$REPOSITORY_URL" "$SOURCE_DIR"
                          cd "$SOURCE_DIR"

                          npm ci
                    environmentVariables:
                      - name: GITHUB_TOKEN
                        type: String
                        value: <+secrets.getValue("github_pat")>
                    outputVariables: []
                  timeout: 20m
              - parallel:
                  - step:
                      type: ShellScript
                      name: Verify formatting
                      identifier: Verify_formatting
                      spec:
                        shell: Bash
                        executionTarget: {}
                        delegateSelectors:
                          - local-delegate
                        source:
                          type: Inline
                          spec:
                            script: |-
                              set -eu
                              BUILD_ROOT="/tmp/change-audit-<+pipeline.executionId>"
                              export PATH="$BUILD_ROOT/node/bin:$PATH"
                              cd "$BUILD_ROOT/source"
                              npm run format:verify
                        environmentVariables: []
                        outputVariables: []
                      timeout: 10m
                  - step:
                      type: ShellScript
                      name: Lint
                      identifier: Lint
                      spec:
                        shell: Bash
                        executionTarget: {}
                        delegateSelectors:
                          - local-delegate
                        source:
                          type: Inline
                          spec:
                            script: |-
                              set -eu
                              BUILD_ROOT="/tmp/change-audit-<+pipeline.executionId>"
                              export PATH="$BUILD_ROOT/node/bin:$PATH"
                              cd "$BUILD_ROOT/source"
                              npm run lint
                        environmentVariables: []
                        outputVariables: []
                      timeout: 10m
                  - step:
                      type: ShellScript
                      name: Typecheck
                      identifier: Typecheck
                      spec:
                        shell: Bash
                        executionTarget: {}
                        delegateSelectors:
                          - local-delegate
                        source:
                          type: Inline
                          spec:
                            script: |-
                              set -eu
                              BUILD_ROOT="/tmp/change-audit-<+pipeline.executionId>"
                              export PATH="$BUILD_ROOT/node/bin:$PATH"
                              cd "$BUILD_ROOT/source"
                              npm run typecheck
                        environmentVariables: []
                        outputVariables: []
                      timeout: 10m
              - step:
                  type: ShellScript
                  name: Application Dry Build
                  identifier: Build_application
                  spec:
                    shell: Bash
                    executionTarget: {}
                    delegateSelectors:
                      - local-delegate
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -eu
                          BUILD_ROOT="/tmp/change-audit-<+pipeline.executionId>"
                          export PATH="$BUILD_ROOT/node/bin:$PATH"
                          cd "$BUILD_ROOT/source"
                          npm run build
                    environmentVariables: []
                    outputVariables: []
                  timeout: 15m
              - step:
                  type: ShellScript
                  name: Clean test workspace
                  identifier: Clean_test_workspace
                  spec:
                    shell: Bash
                    executionTarget: {}
                    delegateSelectors:
                      - local-delegate
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -eu
                          BUILD_ROOT="/tmp/change-audit-<+pipeline.executionId>"
                          case "$BUILD_ROOT" in
                            /tmp/change-audit-*) rm -rf -- "$BUILD_ROOT" ;;
                            *) echo "Refusing to remove unexpected path: $BUILD_ROOT" >&2; exit 1 ;;
                          esac
                    environmentVariables: []
                    outputVariables: []
                  timeout: 5m
                  when:
                    stageStatus: All
        advanced:
          sendGitStatus:
            enabled: true
            name: Build and Test
        tags: {}
    - stage:
        name: Containerise
        identifier: Containerise
        description: Build the production container after validation succeeds
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Build container
                  identifier: Build_container
                  spec:
                    shell: Bash
                    executionTarget: {}
                    delegateSelectors:
                      - local-delegate
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -eu

                          REPOSITORY_URL="https://github.com/dosullivan557/Devops-coursework.git"
                          SOURCE_BRANCH='<+trigger.branch>'
                          ACR_LOGIN_SERVER='<+pipeline.variables.acr_login_server>'
                          BUILD_ROOT="$(mktemp -d /tmp/change-audit-container.XXXXXX)"
                          SOURCE_DIR="$BUILD_ROOT/source"
                          ASKPASS="$BUILD_ROOT/git-askpass.sh"

                          cleanup() {
                            docker logout "$ACR_LOGIN_SERVER" >/dev/null 2>&1 || true
                            rm -rf "$BUILD_ROOT"
                          }
                          trap cleanup EXIT

                          command -v docker >/dev/null 2>&1 || { echo "docker is required on the delegate" >&2; exit 1; }
                          command -v git >/dev/null 2>&1 || { echo "git is required on the delegate" >&2; exit 1; }
                          docker buildx version >/dev/null 2>&1 || { echo "Docker Buildx is required on the delegate" >&2; exit 1; }

                          printf '%s\n' '#!/bin/sh' \
                            'case "$1" in' \
                            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
                            '  *Password*) printf "%s\\n" "$GITHUB_TOKEN" ;;' \
                            'esac' > "$ASKPASS"
                          chmod 700 "$ASKPASS"

                          GIT_ASKPASS="$ASKPASS" GIT_ASKPASS_REQUIRE=force GIT_TERMINAL_PROMPT=0 \
                            git clone --depth 1 --branch "$SOURCE_BRANCH" "$REPOSITORY_URL" "$SOURCE_DIR"

                          IMAGE_VERSION="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$SOURCE_DIR/package.json" | head -n 1)"
                          if [ -z "$IMAGE_VERSION" ]; then
                            echo "Could not read version from package.json" >&2
                            exit 1
                          fi
                          export IMAGE_VERSION
                          IMAGE="$ACR_LOGIN_SERVER/change-audit:$IMAGE_VERSION"
                          LATEST_IMAGE="$ACR_LOGIN_SERVER/change-audit:latest"
                          echo "Building and pushing $IMAGE and $LATEST_IMAGE"

                          printf '%s' '<+secrets.getValue("account.acr_password")>' \
                            | docker login "$ACR_LOGIN_SERVER" \
                              --username '<+secrets.getValue("account.acr_username")>' \
                              --password-stdin

                          docker buildx build \
                            --platform linux/amd64 \
                            --file "$SOURCE_DIR/dockerfile" \
                            --tag "$IMAGE" \
                            --tag "$LATEST_IMAGE" \
                            --push \
                            "$SOURCE_DIR"
                    environmentVariables:
                      - name: GITHUB_TOKEN
                        type: String
                        value: <+secrets.getValue("github_pat")>
                    outputVariables:
                      - name: IMAGE_VERSION
                        type: String
                        value: IMAGE_VERSION
                  timeout: 20m
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.containerise> == "true" && <+pipeline.variables.push_to_acr> == "true"
        tags: {}
    - stage:
        name: Deploy
        identifier: Deploy
        description: Deploy the image produced by Containerise to Azure Container Apps
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Deploy container app
                  identifier: Deploy_container_app
                  spec:
                    shell: Bash
                    executionTarget: {}
                    delegateSelectors:
                      - local-delegate
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -eu

                          AZURE_CLI_IMAGE="mcr.microsoft.com/azure-cli:2.88.0"
                          IMAGE_VERSION='<+pipeline.stages.Containerise.spec.execution.steps.Build_container.output.outputVariables.IMAGE_VERSION>'
                          ACR_LOGIN_SERVER='<+pipeline.variables.acr_login_server>'
                          IMAGE="$ACR_LOGIN_SERVER/change-audit:$IMAGE_VERSION"

                          if [ -z "$IMAGE_VERSION" ]; then
                            echo "Containerise did not produce IMAGE_VERSION" >&2
                            exit 1
                          fi

                          command -v docker >/dev/null 2>&1 || { echo "docker is required on the delegate" >&2; exit 1; }
                          echo "Deploying $IMAGE"
                          docker pull "$AZURE_CLI_IMAGE"
                          docker run --rm \
                            --env 'AZURE_TENANT_ID=<+pipeline.variables.azure_tenant_id>' \
                            --env 'AZURE_SUBSCRIPTION_ID=<+pipeline.variables.azure_subscription_id>' \
                            --env 'AZURE_RESOURCE_GROUP=<+pipeline.variables.azure_resource_group>' \
                            --env 'AZURE_CONTAINER_APP_NAME=<+pipeline.variables.azure_container_app_name>' \
                            --env "IMAGE=$IMAGE" \
                            "$AZURE_CLI_IMAGE" \
                            sh -c '
                              set -eu
                              export AZURE_EXTENSION_USE_DYNAMIC_INSTALL=yes_without_prompt
                              az login --use-device-code --tenant "$AZURE_TENANT_ID" --output none
                              az account set --subscription "$AZURE_SUBSCRIPTION_ID"
                              echo "Ensuring the Microsoft.App resource provider is registered"
                              az provider register --namespace Microsoft.App --wait
                              az containerapp update \
                                --name "$AZURE_CONTAINER_APP_NAME" \
                                --resource-group "$AZURE_RESOURCE_GROUP" \
                                --image "$IMAGE" \
                                --output table
                            '
                    environmentVariables: []
                    outputVariables: []
                  timeout: 20m
        when:
          pipelineStatus: Success
          condition: <+trigger.branch> == "main" && <+pipeline.variables.containerise> == "true" && <+pipeline.variables.push_to_acr> == "true"
        tags: {}
