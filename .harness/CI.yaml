pipeline:
  name: CI
  identifier: CI
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: Test
        identifier: Test
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Install
                  identifier: Install
                  spec:
                    shell: Bash
                    executionTarget: {}
                    delegateSelectors:
                      - harness-delegate
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -euo pipefail
                          NODE_VERSION="22.14.0"
                          NODE_HOME="$PWD/.harness-node"
                          if [[ ! -x "$NODE_HOME/bin/node" ]]; then
                            case "$(uname -m)" in
                              x86_64) NODE_ARCH="x64" ;;
                              arm64|aarch64) NODE_ARCH="arm64" ;;
                              *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
                            esac
                            mkdir -p "$NODE_HOME"
                            curl --fail --location --silent --show-error \
                              "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.xz" \
                              | tar -xJ --strip-components=1 -C "$NODE_HOME"
                          fi
                          export PATH="$NODE_HOME/bin:$PATH"
                          node --version
                          npm --version
                          npm ci
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
              - parallel:
                  - step:
                      type: ShellScript
                      name: Test
                      identifier: Test
                      spec:
                        shell: Bash
                        executionTarget: {}
                        delegateSelectors:
                          - harness-delegate
                        source:
                          type: Inline
                          spec:
                            script: |-
                              export PATH="$PWD/.harness-node/bin:$PATH"
                              npm run test:coverage
                        environmentVariables: []
                        outputVariables: []
                      timeout: 10m
                  - step:
                      type: ShellScript
                      name: Formatting
                      identifier: Formatting
                      spec:
                        shell: Bash
                        executionTarget: {}
                        delegateSelectors:
                          - harness-delegate
                        source:
                          type: Inline
                          spec:
                            script: |-
                              export PATH="$PWD/.harness-node/bin:$PATH"
                              npm run format:verify
                        environmentVariables: []
                        outputVariables: []
                      timeout: 10m
                  - step:
                      type: ShellScript
                      name: Linting
                      identifier: Linting
                      spec:
                        shell: Bash
                        executionTarget: {}
                        delegateSelectors:
                          - harness-delegate
                        source:
                          type: Inline
                          spec:
                            script: |-
                              export PATH="$PWD/.harness-node/bin:$PATH"
                              npm run lint
                        environmentVariables: []
                        outputVariables: []
                      timeout: 10m
                  - step:
                      type: ShellScript
                      name: Typescript Check
                      identifier: Typescript_Check
                      spec:
                        shell: Bash
                        executionTarget: {}
                        delegateSelectors:
                          - harness-delegate
                        source:
                          type: Inline
                          spec:
                            script: |-
                              export PATH="$PWD/.harness-node/bin:$PATH"
                              npm run tsc
                        environmentVariables: []
                        outputVariables: []
                      timeout: 10m
        tags: {}
