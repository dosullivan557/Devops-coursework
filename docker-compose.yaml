services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: change_audit
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh
      - ./apps/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d change_audit"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: dockerfile
      target: dependencies
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: '{"DATABASE_URL":"postgresql://user:password@db:5432/change_audit"}'
      NODE_ENV: development
      NEXTAUTH_URL: http://localhost:3000
      auth: '{"NEXTAUTH_SECRET":"local-dev-nextauth-secret-change-me"}'
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
